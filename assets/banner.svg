<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Tito Mwaisengela, full-stack developer and certified advanced penetration tester">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="55%" stop-color="#1b1a4a"/>
      <stop offset="100%" stop-color="#2a2f7a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7AA2F7"/>
      <stop offset="100%" stop-color="#455CE9"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#455CE9" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7AA2F7" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7AA2F7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7AA2F7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7AA2F7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7AA2F7" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: "JetBrains Mono","Fira Code","SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace; }
      .sans { font-family: -apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif; }
      .name { font-size: 64px; font-weight: 800; letter-spacing: -1px; fill: #ffffff; }
      .ghost { font-size: 64px; font-weight: 800; letter-spacing: -1px; mix-blend-mode: screen; }
      .g1 { fill: #ff4d6d; animation: g1 6s infinite steps(1,end); }
      .g2 { fill: #22d3ee; animation: g2 6s infinite steps(1,end); }
      @keyframes g1 { 0%,91%,100%{opacity:0;transform:translate(0,0)} 92%{opacity:.9;transform:translate(-4px,2px)} 94%{opacity:.9;transform:translate(3px,-1px)} 96%{opacity:0} 97%{opacity:.9;transform:translate(-2px,1px)} 98%{opacity:0} }
      @keyframes g2 { 0%,91%,100%{opacity:0;transform:translate(0,0)} 92%{opacity:.9;transform:translate(4px,-2px)} 94%{opacity:.9;transform:translate(-3px,1px)} 96%{opacity:0} 97%{opacity:.9;transform:translate(2px,-1px)} 98%{opacity:0} }
      .cursor { animation: blink 1s steps(1,end) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .t1 { animation: type 12s infinite; }
      @keyframes type { 0%{opacity:0} 4%{opacity:1} 30%{opacity:1} 33%{opacity:0} 100%{opacity:0} }
      .t2 { animation: type2 12s infinite; }
      @keyframes type2 { 0%,33%{opacity:0} 37%{opacity:1} 63%{opacity:1} 66%{opacity:0} 100%{opacity:0} }
      .t3 { animation: type3 12s infinite; }
      @keyframes type3 { 0%,66%{opacity:0} 70%{opacity:1} 96%{opacity:1} 99%{opacity:0} 100%{opacity:0} }
      .scanline { animation: scan 7s linear infinite; }
      @keyframes scan { from { transform: translateY(-80px); } to { transform: translateY(340px); } }
      .ping { transform-origin: 1010px 160px; animation: ping 3s ease-out infinite; }
      @keyframes ping { 0%{transform:scale(.2);opacity:.9} 100%{transform:scale(1);opacity:0} }
      .dot { animation: dot 3s ease-out infinite; }
      @keyframes dot { 0%,60%{opacity:0} 65%{opacity:1} 100%{opacity:0} }
      .float { animation: float 9s ease-in-out infinite; }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="1010" cy="160" r="340" fill="#455CE9" fill-opacity="0.08"/>
    <circle cx="150" cy="330" r="200" fill="#7AA2F7" fill-opacity="0.05"/>
    <rect class="scanline" x="0" y="0" width="1200" height="80" fill="url(#scan)"/>

    <!-- radar -->
    <g class="float">
      <g stroke="#7AA2F7" stroke-opacity="0.35" fill="none" stroke-width="1">
        <circle cx="1010" cy="160" r="110"/>
        <circle cx="1010" cy="160" r="75"/>
        <circle cx="1010" cy="160" r="40"/>
        <line x1="890" y1="160" x2="1130" y2="160"/>
        <line x1="1010" y1="40" x2="1010" y2="280"/>
      </g>
      <g>
        <path d="M1010 160 L1120 160 A110 110 0 0 0 1010 50 Z" fill="url(#sweep)">
          <animateTransform attributeName="transform" type="rotate" from="0 1010 160" to="360 1010 160" dur="4s" repeatCount="indefinite"/>
        </path>
        <line x1="1010" y1="160" x2="1120" y2="160" stroke="#7AA2F7" stroke-width="2" filter="url(#glow)">
          <animateTransform attributeName="transform" type="rotate" from="0 1010 160" to="360 1010 160" dur="4s" repeatCount="indefinite"/>
        </line>
      </g>
      <circle class="ping" cx="1010" cy="160" r="110" fill="none" stroke="#7AA2F7" stroke-width="2"/>
      <g class="dot">
        <circle cx="1062" cy="118" r="4" fill="#22c55e" filter="url(#glow)"/>
        <text class="mono" x="1072" y="114" font-size="11" fill="#22c55e">host up</text>
      </g>
      <circle cx="960" cy="200" r="3.5" fill="#ff4d6d" filter="url(#glow)"/>
      <text class="mono" x="900" y="222" font-size="11" fill="#ff4d6d">CVE patched</text>
    </g>

    <!-- shield mark -->
    <g transform="translate(60,70)" filter="url(#glow)">
      <path d="M40 0 L80 14 V46 C80 76 58 98 40 108 C22 98 0 76 0 46 V14 Z" fill="none" stroke="url(#accent)" stroke-width="3"/>
      <path d="M22 54 L36 68 L60 38" fill="none" stroke="#7AA2F7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="stroke-dasharray" values="0 80;80 0" dur="1.6s" begin="0s" fill="freeze"/>
      </path>
    </g>

    <!-- name with glitch -->
    <g transform="translate(170,118)">
      <text class="sans ghost g1" x="0" y="0">Tito Mwaisengela</text>
      <text class="sans ghost g2" x="0" y="0">Tito Mwaisengela</text>
      <text class="sans name" x="0" y="0">Tito Mwaisengela</text>
    </g>
    <rect x="170" y="134" width="420" height="4" rx="2" fill="url(#accent)"/>

    <text class="sans" x="170" y="172" font-size="21" fill="#c7d2fe" font-weight="500">Full-Stack Developer • Certified Advanced Penetration Tester</text>

    <!-- terminal line -->
    <g transform="translate(170,230)">
      <rect x="-14" y="-28" width="690" height="46" rx="8" fill="#0b0a1f" fill-opacity="0.75" stroke="#455CE9" stroke-opacity="0.5"/>
      <circle cx="2" cy="-5" r="4" fill="#ff5f57"/><circle cx="16" cy="-5" r="4" fill="#febc2e"/><circle cx="30" cy="-5" r="4" fill="#28c840"/>
      <g class="mono" font-size="17">
        <text x="48" y="1" fill="#7AA2F7">$</text>
        <text class="t1" x="64" y="1" fill="#e2e8f0">build secure  →  break responsibly  →  ship fast</text>
        <text class="t2" x="64" y="1" fill="#e2e8f0">nmap -sV titodevsec.online  →  0 open doors, 1 open mind</text>
        <text class="t3" x="64" y="1" fill="#e2e8f0">while(true){ learn(); build(); harden(); }</text>
        <rect class="cursor" x="600" y="-12" width="9" height="16" fill="#7AA2F7"/>
      </g>
    </g>

    <text class="mono" x="170" y="290" font-size="13" fill="#8b9bd1">Dar es Salaam, Tanzania 🇹🇿  ·  open for freelance &amp; collaboration</text>
    <text class="mono" x="1120" y="300" font-size="12" fill="#5c6aa8" text-anchor="end">devsec · est. UDSM</text>
  </g>
</svg>
