name: Grow the bonsai

on:
  schedule:
    - cron: "0 3 * * *"   # re-grow daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: egorthinks/git-bonsai@v1
        with:
          output-dir: output
          commit-message: "chore: tend the bonsai 🌳"
